# Banc local uniquement : API, interface, SQLite et worker intégré en boucle locale.
# Voir DOCKER-COMPOSE-SPLIT.md. Aucun Central__ApiBaseUrl sur le central.
name: encoding-central

services:
  server:
    image: backend-encoding-central:${LOCAL_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: central
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    hostname: encoding-central
    environment:
      Worker__Name: encoding-central
      Auth__SetupToken: ${AUTH_SETUP_TOKEN:-}
      Central__AdvertisedApiBaseUrl: http://encoding-central:8080
    ports:
      - "127.0.0.1:${CENTRAL_API_PORT:-5080}:8080"
    volumes:
      - central-node-data:/var/lib/encoding-node
      - central-media:/libraries/central
      - shared-media:/libraries/shared
      - central-only:/libraries/central-only
    networks:
      encoding-network:
        aliases:
          - encoding-central
    restart: unless-stopped

networks:
  encoding-network:
    name: encoding-network
    external: true

volumes:
  central-node-data:
  central-media:
  shared-media:
    name: encoding-test-shared-media
  central-only:
