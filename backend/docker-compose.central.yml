# Deux nœuds utilisent l'image unique : l'API sur le serveur et l'interface worker
# sur le worker. Les volumes existants restent attachés à leur nœud respectif.
name: encoding-central

services:
  server:
    image: backend-encoding
    build:
      context: ..
      dockerfile: backend/Dockerfile
    hostname: encoding-central
    environment:
      Node__Name: encoding-central
      Node__Roles: server
    ports:
      - "5080:8080"
    volumes:
      - central-node-data:/var/lib/encoding-node
      - /home/remi/encoding-tests/central-media:/libraries/central
      - /home/remi/encoding-tests/shared-media:/libraries/shared
      - /home/remi/encoding-tests/central-only:/libraries/central-only
    restart: unless-stopped

  worker:
    image: backend-encoding
    build:
      context: ..
      dockerfile: backend/Dockerfile
    hostname: encoding-worker
    environment:
      Node__Name: encoding-worker
      Node__Roles: worker
      Cluster__ApiBaseUrl: http://server:8080/
      WorkerUi__Port: 8081
      WorkerUi__Expose: "true"
    ports:
      - "5081:8081"
    volumes:
      - worker-node-data:/var/lib/encoding-node
      - /home/remi/encoding-tests/worker-media:/libraries/worker
      - /home/remi/encoding-tests/shared-media:/libraries/shared
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "987"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  central-node-data:
  worker-node-data:
