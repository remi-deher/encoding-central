# Le central est autonome ; le worker est une image distincte sans API ni base SQLite d'autorité.
name: encoding-central

services:
  server:
    image: backend-encoding-central
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: central
    hostname: encoding-central
    environment:
      Node__Name: encoding-central
      Node__Roles: server
    ports:
      - "${CENTRAL_API_PORT:-5080}:8080"
    volumes:
      - central-node-data:/var/lib/encoding-node
      - /home/remi/encoding-tests/central-media:/libraries/central
      - /home/remi/encoding-tests/shared-media:/libraries/shared
      - /home/remi/encoding-tests/central-only:/libraries/central-only
    restart: unless-stopped

  worker:
    image: backend-encoding-worker
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
    hostname: encoding-worker
    environment:
      Node__Name: encoding-worker
      WorkerUi__Port: 8081
    ports:
      - "5081:8081"
    volumes:
      - worker-node-data:/var/lib/encoding-node
      - /home/remi/encoding-tests/worker-media:/libraries/worker
      - /home/remi/encoding-tests/shared-media:/libraries/shared
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "987"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  central-node-data:
  worker-node-data:
