# Banc local uniquement : agent et interface, sans base de données.
# L'image fixe le rôle worker ; l'enrôlement utilise la session admin via le relais.
name: encoding-worker

services:
  worker:
    image: backend-encoding-worker:${LOCAL_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    hostname: encoding-worker
    environment:
      Worker__Name: encoding-worker
      WorkerUi__Port: "8081"
      Central__ApiBaseUrl: http://encoding-central:8080
    ports:
      - "127.0.0.1:${WORKER_UI_PORT:-5081}:8081"
    volumes:
      - worker-node-data:/var/lib/encoding-node
      - worker-media:/libraries/worker
      - shared-media:/libraries/shared
    networks:
      - encoding-network
    restart: unless-stopped

networks:
  encoding-network:
    name: encoding-network
    external: true

volumes:
  worker-node-data:
  worker-media:
  shared-media:
    name: encoding-test-shared-media
