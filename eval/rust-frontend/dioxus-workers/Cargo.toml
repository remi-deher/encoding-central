[package]
name = "dioxus-workers"
version = "0.1.0"
edition = "2024"
publish = false

# Prototype d'évaluation (#30) : vue Workers en Dioxus + DioxusLabs/components. Ne pas intégrer au produit.
[dependencies]
dioxus = { version = "=0.7.10", features = ["web"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
