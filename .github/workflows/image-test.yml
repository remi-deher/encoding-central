name: Image Test
# Publie les images Docker :test et :test-<sha7> sur push vers dev (merge de PR)
# pour les tests de l'agent prod-tester. NE PAS UTILISER EN PRODUCTION.
# Secrets requis (Settings > Secrets and variables > Actions) : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# Si les secrets sont manquants, le workflow échoue proprement avec un message clair.
# SÉCURITÉ : Le jeton Docker Hub reste dans les secrets GitHub, jamais en clair.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: image-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-secrets:
    name: Vérifier secrets Docker Hub
    runs-on: ubuntu-latest
    outputs:
      has_username: ${{ steps.check.outputs.has_username }}
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        name: Vérification des secrets requis
        run: |
          # Vérifier la présence des secrets sans les afficher
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::Le secret DOCKERHUB_USERNAME est manquant."
            echo "has_username=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_username=true" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Le secret DOCKERHUB_TOKEN est manquant."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Les secrets Docker Hub (DOCKERHUB_USERNAME et DOCKERHUB_TOKEN) sont requis pour publier les images test."
            echo "Veuillez configurer ces secrets dans Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  publish:
    name: Publier images test
    needs: verify-secrets
    if: needs.verify-secrets.outputs.has_username == 'true' && needs.verify-secrets.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraire short SHA
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=test-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier l'image central (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: central
          push: true
          build-args: |
            APP_VERSION=${{ steps.sha.outputs.APP_VERSION }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/encoding-central:test
            ${{ secrets.DOCKERHUB_USERNAME }}/encoding-central:test-${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha,scope=encoding-central-test
          cache-to: type=gha,scope=encoding-central-test,mode=max

      - name: Publier l'image worker (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: worker
          push: true
          build-args: |
            APP_VERSION=${{ steps.sha.outputs.APP_VERSION }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/encoding-worker:test
            ${{ secrets.DOCKERHUB_USERNAME }}/encoding-worker:test-${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha,scope=encoding-worker-test
          cache-to: type=gha,scope=encoding-worker-test,mode=max
