name: Image Branch
# Publie les images Docker <branche> et <branche>-<sha7> sur push vers test ou dev
# pour les tests de l'agent prod-tester. NE PAS UTILISER EN PRODUCTION.
# Secrets requis (Settings > Secrets and variables > Actions) : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# Si les secrets sont manquants, le workflow échoue proprement avec un message clair.
# SÉCURITÉ : Le jeton Docker Hub reste dans les secrets GitHub, jamais en clair.
# Dépôts Docker Hub publics (décision chef-of-staff).

on:
  push:
    branches:
      - test
      - dev
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-secrets:
    name: Vérifier secrets Docker Hub
    runs-on: ubuntu-latest
    outputs:
      has_username: ${{ steps.check.outputs.has_username }}
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        name: Vérification des secrets requis
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Vérifier la présence des secrets sans les afficher
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Le secret DOCKERHUB_USERNAME est manquant."
            echo "has_username=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_username=true" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Le secret DOCKERHUB_TOKEN est manquant."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
          
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Les secrets Docker Hub (DOCKERHUB_USERNAME et DOCKERHUB_TOKEN) sont requis pour publier les images."
            echo "Veuillez configurer ces secrets dans Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  publish:
    name: Publier images branch
    needs: verify-secrets
    if: >-
      needs.verify-secrets.outputs.has_username == 'true' &&
      needs.verify-secrets.outputs.has_token == 'true' &&
      (github.ref == 'refs/heads/test' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Extraire short SHA et branche
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCHE="${GITHUB_REF_NAME}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "branche=$BRANCHE" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${BRANCHE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier image central immuable
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: central
          push: true
          build-args: |
            APP_VERSION=${{ steps.sha.outputs.APP_VERSION }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/encoding-central:${{ steps.sha.outputs.branche }}-${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha,scope=encoding-central-${{ steps.sha.outputs.branche }}
          cache-to: type=gha,scope=encoding-central-${{ steps.sha.outputs.branche }},mode=max

      - name: Publier image worker immuable
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: worker
          push: true
          build-args: |
            APP_VERSION=${{ steps.sha.outputs.APP_VERSION }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/encoding-worker:${{ steps.sha.outputs.branche }}-${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha,scope=encoding-worker-${{ steps.sha.outputs.branche }}
          cache-to: type=gha,scope=encoding-worker-${{ steps.sha.outputs.branche }},mode=max

      - name: Créer étiquettes flottantes via imagetools (sans rebuild)
        env:
          DOCKERHUB_USER: ${{ env.DOCKERHUB_USERNAME }}
        run: |
          # Utiliser imagetools pour créer les tags flottants à partir des images immuables
          # sans rebuild, conformément à l'ADR 0047
          docker buildx imagetools create \
            "${DOCKERHUB_USER}/encoding-central:${{ steps.sha.outputs.branche }}-${{ steps.sha.outputs.short_sha }}" \
            --tag "${DOCKERHUB_USER}/encoding-central:${{ steps.sha.outputs.branche }}"
          
          docker buildx imagetools create \
            "${DOCKERHUB_USER}/encoding-worker:${{ steps.sha.outputs.branche }}-${{ steps.sha.outputs.short_sha }}" \
            --tag "${DOCKERHUB_USER}/encoding-worker:${{ steps.sha.outputs.branche }}"
