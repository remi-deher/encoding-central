name: Backend dev
# Garde-fou léger de la branche dev : formatage/lint et contrôle d'ascendance seulement.
# Compilation et tests restent dans backend.yml,
# déclenchés par la PR de promotion vers main (TEST_RULES.md §8). Ce workflow est volontairement séparé :
# backend.yml ne doit pas s'exécuter sur dev, sinon ses jobs ignorés produiraient des contrôles « skipped »
# que .github/scripts/wait-ci.mjs lirait comme des échecs lors de la promotion.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: backend-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Le déclencheur n'a pas de filtre de chemins : sinon le contrôle requis resterait « en attente »
  # sur une PR sans changement backend. Le filtrage est fait ici, et le contrôle `dev-ci` conclut toujours.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(backend/|\.github/workflows/backend-dev\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
  dev-ancestry:
    name: "Vérifier dev ⊆ test (contre-épreuve : ref=head.sha explicite)"
    # Exécuté seulement sur PR test → dev depuis ce dépôt
    # Contre-épreuve : checkout avec ref=head.sha pour s'assurer de travailler sur le SHA exact de la PR
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'test' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Récupérer dev
        run: git fetch origin dev
      - name: Vérifier ascendance
        run: |
          # Vérification principale : dev ⊆ test (dev ne porte aucun commit absent de test)
          MISSING_IN_TEST="$(git rev-list --no-merges origin/dev ^HEAD)"
          if [ -n "$MISSING_IN_TEST" ]; then
            echo "::error::dev porte des commits absents de test : les reporter dans test par PR"
            echo "Commits manquants dans test :"
            git rev-list --no-merges origin/dev ^HEAD | head -20
            exit 1
          fi
          echo "Ascendance vérifiée : dev ⊆ test"

  backend-dev-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/Encoding.sln
      - name: Lint local verification policy
        run: node .github/scripts/lint-local-profile.mjs
      - name: Vérifier le formatage et les règles de style C#
        run: dotnet format backend/Encoding.sln --verify-no-changes --no-restore --verbosity quiet
  # Contrôle agrégateur à rendre requis dans la protection de dev (et lui seul).
  dev-ci:
    if: always()
    needs: [changes, backend-dev-lint, dev-ancestry]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conclude
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.backend-dev-lint.result }}
          ANCESTRY: ${{ needs.dev-ancestry.result }}
        run: |
          echo "changes=$CHANGES backend-dev-lint=$LINT dev-ancestry=$ANCESTRY"
          test "$CHANGES" = success
          test "$LINT" = success || test "$LINT" = skipped
          test "$ANCESTRY" = success || test "$ANCESTRY" = skipped
