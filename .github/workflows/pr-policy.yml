name: PR policy
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the source and target branches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Règles :
          # - test accepte toute branche SAUF main (source = ce dépôt)
          # - dev accepte test uniquement
          # - main accepte dev uniquement depuis ce dépôt
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "Pull request autorisée : promotion $HEAD_REF vers $BASE_REF."
            exit 0
          fi
          if [ "$BASE_REF" = "dev" ] && [ "$HEAD_REF" = "test" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "Pull request autorisée : promotion $HEAD_REF vers $BASE_REF."
            exit 0
          fi
          if [ "$BASE_REF" = "test" ] && [ "$HEAD_REF" != "main" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "Pull request autorisée : $HEAD_REF vers $BASE_REF."
            exit 0
          fi

          echo "Seules les PR vers test (hors main, depuis ce dépôt), test vers dev, et dev vers main sont autorisées."
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment "PR fermée automatiquement : seules les PR vers test (hors main, depuis ce dépôt), les promotions test vers dev, et dev vers main sont autorisées."
          exit 1
