name: Image
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/image.yml'
permissions:
  contents: read
concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  image:
    # Vérifie que les deux images (central et worker) se construisent avant la fusion ; la publication se fait dans release.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image central
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: central
          push: false
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=encoding-central
          cache-to: type=gha,scope=encoding-central,mode=max
      - name: Image worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: worker
          push: false
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=encoding-worker
          cache-to: type=gha,scope=encoding-worker,mode=max
