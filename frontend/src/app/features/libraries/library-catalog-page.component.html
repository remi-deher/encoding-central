<app-library-preparation-template
  [title]="title()"
  [items]="workflow.libraryItems()"
  [rowActions]="catalog.libraryRowActions"
  [selectionActions]="catalog.librarySelectionActions"
  [groupDefinitions]="workflow.libraryGroups"
  [selectable]="true"
  openMode="title"
  menuPlacement="top-right"
  [(selectedIds)]="catalog.selectedLibraryIds"
  listEmptyMessage="Aucune bibliothèque n’est déclarée."
  [detailOpen]="catalog.selectedLibrary() !== null"
  [detailTabIndex]="catalog.selectedLibraryTabIndex()"
  (detailTabIndexChange)="catalog.selectedLibraryTabIndex.set($event)"
  [mediaCount]="workflow.mediaRows().length"
  [accessCount]="access.selectedAccesses().length"
  [showToolbar]="false"
  [actionOpen]="catalog.actionOpen()"
  [actionTitle]="workflow.actionTitle()"
  [actionDescription]="workflow.actionDescription()"
  [actionStep]="actionStep()"
  [detailTitle]="workflow.detailTitle()"
  [detailDescription]="workflow.detailDescription()"
  (detailClosed)="catalog.onDetailClosed()"
  (actionClosed)="catalog.closeCreateLibrary()"
  (open)="catalog.onLibraryOpen({ id: $event })"
  (action)="
    catalog.onLibraryAction($event, {
      onProcessing: () => void workflow.configureProcessing(),
      onFlow: () => void workflow.assignFlow(),
    })
  "
  (toggleChange)="catalog.onLibraryItemToggle($event)"
  (selectionAction)="catalog.onLibrarySelection($event)"
>
  <input
    #libraryImportFile
    type="file"
    accept="application/json,.json"
    hidden
    aria-label="Importer un export de bibliothèques"
    (change)="onLibraryImportSelected($event)"
  />

  <ng-template #catalogueNavigation>
    <app-library-section-tabs catalogue-navigation selected="media" />
  </ng-template>

  <ng-template #librarySummary>
    <app-library-summary-tab />
  </ng-template>

  <ng-template #libraryMedia>
    <app-library-media-tab />
  </ng-template>

  <ng-template #libraryAccess>
    <app-library-access-tab />
  </ng-template>

  <ng-template #libraryHistory>
    <app-library-history-tab />
  </ng-template>

  <ng-template #detailHeaderActions>
    @if (catalog.selectedLibrary()) {
      <app-drawer-action-button
        label="Attribuer un flow"
        variant="outlined"
        (activated)="workflow.assignFlow()"
      />
      <app-drawer-action-button
        label="Surveillance et limites"
        variant="outlined"
        (activated)="workflow.configureProcessing()"
      />
      <app-drawer-action-button
        label="Attribuer un worker / groupe"
        (activated)="access.configureAccesses()"
      />
    }
  </ng-template>

  <ng-template #actionFooterActions>
    @if (actionRecordForm(); as form) {
      <app-record-form-actions [form]="form" />
    }
  </ng-template>

  <ng-template #actionContent>
    <app-library-action-drawer />
  </ng-template>
</app-library-preparation-template>
