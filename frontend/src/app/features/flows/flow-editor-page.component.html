<app-flow-workspace-template>
  <!-- Zone 1 : Command Bar -->
  <app-flow-command-bar
    flow-workspace-toolbar
    [canUndo]="graph.canUndoEdit()"
    [canRedo]="graph.canRedoEdit()"
    (undoRequested)="graph.undoEdit()"
    (redoRequested)="graph.undoEdit(true)"
    [title]="persistence.flowTitle()"
    [mediaType]="components.flowMediaType()"
    [storedVersion]="persistence.storedVersion()"
    [hasDraft]="persistence.hasDraft()"
    [hasUnsavedChanges]="hasUnsavedChanges()"
    [backupStatus]="persistence.backupStatus()"
    [editorStatus]="persistence.editorStatus()"
    [nodeCount]="graph.nodes().length"
    [saving]="persistence.saving()"
    [validating]="persistence.validating()"
    [canSave]="hasUnsavedChanges() || persistence.hasDraft()"
    [disabled]="persistence.loadState() !== 'ready'"
    [simulatorBusy]="simulator.busy()"
    [canCreatePack]="persistence.storedVersion() >= 1"
    [canRestoreAiProposal]="graph.aiProposalRollback() !== null"
    [paletteOpen]="paletteOpen()"
    [trayOpen]="trayOpen()"
    [showConnections]="showFlowConnections()"
    (titleChange)="persistence.onTitleChange($event)"
    (saveRequested)="persistence.saveFlow()"
    (validateRequested)="validateGraph()"
    (simulateRequested)="openSimulator()"
    (simulationSettingsRequested)="openSimulator(true)"
    (packCreationRequested)="openPackCreation()"
    (restoreAiProposalRequested)="persistence.restoreAiProposal()"
    (togglePalette)="togglePalette()"
    (toggleTray)="trayOpen.set(!trayOpen())"
    (toggleConnections)="toggleFlowConnections()"
    (autoLayoutRequested)="requestAutoLayout()"
  >
  </app-flow-command-bar>

  <!-- Main Split Body (Zone 2 and Zone 3) -->
  <app-detail-drawer
    class="flow-inspector"
    flow-workspace-main
    [fill]="true"
    mode="side"
    size="standard"
    [opened]="inspector.configuringNode() !== undefined"
    [title]="
      inspector.configuringNode()?.name ||
      inspector.configuringNode()?.component?.name ||
      'Réglages du bloc'
    "
    [eyebrow]="inspector.configuringNode()?.component?.pluginName ?? ''"
    [description]="inspector.configuringNode()?.component?.description ?? ''"
    [content]="inspectorContent"
    (closed)="inspector.closeComponentEditor()"
  >
    <div drawer-main class="workbench-body">
      <!-- Zone 2 : Left Palette Dock -->
      <app-flow-palette-dock
        [opened]="paletteOpen()"
        [(pinned)]="palettePinned"
        [components]="components.components()"
        [otherMediaComponents]="components.otherMediaComponents()"
        [flowMediaType]="components.flowMediaType()"
        [packCatalog]="persistence.packCatalog()"
        [insertionPending]="graph.componentDestination() !== null"
        [destinationLabel]="graph.destinationDescription()"
        (openedChange)="paletteOpen.set($event)"
        (componentSelected)="onPaletteComponentSelected($event)"
        (packSelected)="packInsertion.onPalettePackSelected($event)"
        (cancelInsertion)="cancelInsertion()"
      />

      <!-- Zone 3 : Center Canvas Workspace -->
      <main
        appFlowComponentDrop
        (componentDropped)="onPaletteComponentDropped($event)"
        class="workbench-canvas"
        role="main"
        aria-label="Canevas d'édition du flow"
      >
        @if (persistence.loadState() !== 'ready') {
          <div class="canvas-state-message" role="status">
            <p>
              {{
                persistence.loadState() === 'loading'
                  ? 'Chargement du flow…'
                  : 'Le flow n’a pas pu être chargé.'
              }}
            </p>
          </div>
        } @else {
          <app-flow-graph-editor
            (componentDropped)="onPaletteComponentDropped($event)"
            [layoutKey]="persistence.validationFlowId"
            [simulationResult]="simulator.result()"
            (simulationDetailsRequested)="trayTab.set('simulation'); trayOpen.set(true)"
            (paletteRequested)="openPalette()"
            (duplicateRequested)="editing.duplicateNode($event)"
            (aiRequested)="openAiAssistant($event)"
            [nodes]="graph.nodes()"
            [componentPacks]="graph.componentPacks()"
            [mediaType]="components.flowMediaType()"
            [connections]="graph.connections()"
            [showConnections]="showFlowConnections()"
            [autoLayoutRequest]="autoLayoutRequest()"
            (configurationRequested)="onConfigurationRequested($event)"
            (branchComponentRequested)="onBranchComponentRequested($event)"
            (connectionRequested)="editing.onConnectionRequested($event)"
            (nodeRemoved)="editing.removeNode($event)"
            (connectionRemoved)="editing.removeConnection($event)"
          />
        }
      </main>
    </div>
  </app-detail-drawer>
  <!-- Zone 5 : Bottom Tray (Simulation & Diagnostics) -->
  <app-flow-simulation-tray
    flow-workspace-tray
    [opened]="trayOpen()"
    [(activeTab)]="trayTab"
    [nodes]="graph.nodes()"
    [profile]="simulator.profile()"
    [result]="simulator.result()"
    [busy]="simulator.busy()"
    [error]="simulator.error()"
    [validationIssues]="persistence.validationIssues()"
    [validating]="persistence.validating()"
    [isValid]="persistence.validationSuccess()"
    (openedChange)="trayOpen.set($event)"
    (runRequested)="runSimulation($event)"
    (continueRequested)="runSimulation($event, true)"
    (fileSelected)="simulator.import($event)"
    (revalidateRequested)="validateGraph()"
  />

  <ng-template #inspectorContent>
    @if (inspector.configuringNode(); as current) {
      <app-component-configuration-form
        [schema]="inspector.configuringSchema()"
        [referenceOptions]="inspector.configurationReferences()"
        [values]="inspector.configuringValues()"
        [instanceName]="current.name ?? ''"
        [progressiveDisclosure]="true"
        submitLabel="Appliquer les réglages"
        (instanceNameChange)="inspector.renameNode($event)"
        (saved)="inspector.saveNodeConfiguration($event)"
        (cancelled)="inspector.closeComponentEditor()"
      >
        @if (current.component.kind !== 'input') {
          <button
            matButton="text"
            class="danger"
            form-secondary-actions
            type="button"
            (click)="inspector.deleteConfiguredNode(current.id, (id) => editing.removeNode(id))"
          >
            Supprimer ce bloc
          </button>
        }
      </app-component-configuration-form>
    }
  </ng-template>
</app-flow-workspace-template>
