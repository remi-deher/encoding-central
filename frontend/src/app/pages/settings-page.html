<header class="page-intro">
  <p class="eyebrow">Configurer</p>
  <h1>Paramètres</h1>
  <p class="lede">Le nom et l'adresse publique identifient ce serveur auprès des futurs workers.</p>
</header>
<form class="settings-card" [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field appearance="outline">
    <mat-label>Nom du serveur</mat-label>
    <input matInput formControlName="displayName" autocomplete="organization" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Adresse publique</mat-label>
    <input matInput formControlName="publicBaseUrl" autocomplete="url" inputmode="url" />
  </mat-form-field>
  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }
  @if (saved()) {
    <p class="form-success" role="status">Enregistré.</p>
  }
  <button mat-flat-button type="submit" [disabled]="pending()">Enregistrer</button>
</form>
