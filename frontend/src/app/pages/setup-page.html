<form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
  <h1>Mettre le serveur en service</h1>
  <p class="lede">Ce serveur est la seule autorité. Le compte créé en est l'administrateur.</p>
  <mat-form-field appearance="outline">
    <mat-label>Nom du serveur</mat-label>
    <input matInput formControlName="displayName" autocomplete="organization" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Adresse publique</mat-label>
    <input matInput formControlName="publicBaseUrl" autocomplete="url" inputmode="url" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Identifiant</mat-label>
    <input matInput formControlName="username" autocomplete="username" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Mot de passe</mat-label>
    <input matInput type="password" formControlName="password" autocomplete="new-password" />
  </mat-form-field>
  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }
  <button mat-flat-button type="submit" [disabled]="pending()">Créer le serveur</button>
</form>
