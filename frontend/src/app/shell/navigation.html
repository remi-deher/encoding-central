@if (!mobileDock()) {
  <nav class="primary-navigation" [class.is-collapsed]="collapsed()" aria-label="Navigation principale">
    <div class="navigation-items">
      @for (item of destinations; track item.path) {
        <a
          class="navigation-link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          ariaCurrentWhenActive="page"
          [attr.aria-label]="item.label"
        >
          <span class="navigation-icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="navigation-svg">
              @switch (item.icon) {
                @case ('overview') {
                  <rect x="4" y="4" width="7" height="7" rx="1.5" />
                  <rect x="13" y="4" width="7" height="7" rx="1.5" />
                  <rect x="4" y="13" width="7" height="7" rx="1.5" />
                  <rect x="13" y="13" width="7" height="7" rx="1.5" />
                }
                @case ('settings') {
                  <circle cx="12" cy="12" r="3" />
                  <path d="M12 3.5v2.2M12 18.3V21M3.5 12h2.2M18.3 12H21M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6 5.8 18.2" />
                }
              }
            </svg>
          </span>
          @if (!collapsed()) {
            <span class="navigation-link-label">{{ item.label }}</span>
          }
        </a>
      }
    </div>
  </nav>
} @else {
  <nav class="mobile-navigation" aria-label="Navigation principale">
    <ul class="mobile-dock-items">
      @for (item of destinations; track item.path) {
        <li>
          <a
            class="mobile-dock-link"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            ariaCurrentWhenActive="page"
          >
            <span class="mobile-dock-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="navigation-svg">
                @switch (item.icon) {
                  @case ('overview') {
                    <rect x="4" y="4" width="7" height="7" rx="1.5" />
                    <rect x="13" y="4" width="7" height="7" rx="1.5" />
                    <rect x="4" y="13" width="7" height="7" rx="1.5" />
                    <rect x="13" y="13" width="7" height="7" rx="1.5" />
                  }
                  @case ('settings') {
                    <circle cx="12" cy="12" r="3" />
                    <path d="M12 3.5v2.2M12 18.3V21M3.5 12h2.2M18.3 12H21M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6 5.8 18.2" />
                  }
                }
              </svg>
            </span>
            <span class="mobile-dock-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
}
